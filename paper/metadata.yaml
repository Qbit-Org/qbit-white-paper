abstract: |
  Peer-to-peer digital value depends on cryptography that must remain trustworthy over
  long time horizons. As post-quantum migration moves from theory to
  engineering reality, open monetary networks need more than a signature
  upgrade: they need an architecture that accounts for larger witnesses,
  different exposure surfaces, and the operational cost of carrying
  post-quantum data through the system. Qbit is built around that requirement.
  It combines bounded SLH-DSA, P2MR outputs, direct pricing of witness bytes,
  fast aggregate block cadence, dual-lane mining, and explicit
  witness-retention modes to preserve self-custodied digital value under
  post-quantum constraints.
